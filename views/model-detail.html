<button class="md-back" onclick="closeModel()">
  <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  Back to Models
</button>

<!-- Image Gallery -->
<div class="sc" style="margin-bottom: 16px;">
  <div class="sc-head">
    <span class="sc-title">Image Gallery</span>
    <div style="display: flex; gap: 8px; align-items: center;">
      <button class="btn-sm" onclick="prevImage()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Prev
      </button>
      <span id="gallery-counter" style="font-size: .7rem; color: var(--muted);">1 / 5</span>
      <button class="btn-sm" onclick="nextImage()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
        Next
      </button>
    </div>
  </div>
  <div style="padding: 20px; position: relative;">
    <!-- Main Image Display -->
    <div id="main-image-container" style="width: 100%; height: 400px; border-radius: 8px; overflow: hidden; background: #FAFAF8; border: 1px solid var(--border); position: relative;">
      <img id="main-image" src="../Manufacturing/1.webp" alt="Model Main Image" style="width: 100%; height: 100%; object-fit: contain; display: block;">
      <div id="image-loading" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.9);">
        <div style="text-align: center;">
          <div style="width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 10px;"></div>
          <div style="font-size: .8rem; color: var(--muted);">Loading image...</div>
        </div>
      </div>
    </div>
    
    <!-- Thumbnail Strip -->
    <div id="thumbnail-strip" style="display: flex; gap: 8px; margin-top: 12px; overflow-x: auto; padding: 8px 0;">
      <!-- Thumbnails will be populated by JavaScript -->
    </div>
    
    <!-- Image Info -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);">
      <div>
        <div style="font-size: .6rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted2); margin-bottom: 2px;">
          Current View
        </div>
        <div id="image-description" style="font-size: .8rem; color: var(--text);">Front view - Main sample</div>
      </div>
      <div style="display: flex; gap: 6px;">
        <button class="btn-sm" onclick="rotateImage()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
          Rotate
        </button>
        <button class="btn-sm" onclick="downloadImage()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Header card (filled by JS) -->
<div class="md-header-card" id="md-header"></div>

<!-- Tab bar -->
<div class="md-tabs" id="md-tab-bar">
  <button class="md-tab active" data-pane="md-overview" onclick="setMdTab(this)">Overview</button>
  <button class="md-tab" data-pane="md-bom" onclick="setMdTab(this)">BOM</button>
  <button class="md-tab" data-pane="md-gamme" onclick="setMdTab(this)">Gamme</button>
  <button class="md-tab" data-pane="md-pom" onclick="setMdTab(this)">POM</button>
  <button class="md-tab" data-pane="md-samples" onclick="setMdTab(this)">Samples & Revision</button>
  <button class="md-tab" data-pane="md-audit" onclick="setMdTab(this)">Audit Trail</button>
</div>

<!-- Panes (all filled by JS) -->
<div id="md-overview" class="md-pane active"></div>
<div id="md-bom" class="md-pane"></div>
<div id="md-gamme" class="md-pane"></div>
<div id="md-pom" class="md-pane"></div>
<div id="md-samples" class="md-pane"></div>
<div id="md-audit" class="md-pane"></div>

<style>
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  
  .thumbnail {
    width: 80px;
    height: 80px;
    border-radius: 4px;
    overflow: hidden;
    border: 2px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
    transition: border-color 0.15s, transform 0.15s;
  }
  
  .thumbnail:hover {
    border-color: var(--gold);
    transform: translateY(-2px);
  }
  
  .thumbnail.active {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(196, 163, 90, 0.2);
  }
  
  .thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
</style>
