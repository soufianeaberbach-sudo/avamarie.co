
      <!-- Toolbar -->
      <div class="toolbar plan-print-hide" style="margin-bottom:14px">
        <div>
          <div style="font-size:.92rem;font-weight:600;color:var(--text)">Production Planning</div>
          <div style="font-size:.74rem;color:var(--muted);margin-top:2px" id="plan-toolbar-sub">20 Lines · Sewing</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <button class="btn-outline" onclick="togglePlanHoursPanel()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Hours
          </button>
          <button class="btn-outline" onclick="printGantt()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
            Print
          </button>
        </div>
      </div>

      <!-- Hours panel -->
      <div id="plan-hrs-panel" class="plan-print-hide" style="display:none;margin-bottom:14px;background:var(--white);border:1px solid var(--border);border-radius:8px;padding:16px 20px">
        <div style="font-size:.7rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin-bottom:12px">Working Hours Per Day</div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:8px">
          <div><div style="font-size:.64rem;font-weight:700;text-transform:uppercase;color:var(--muted2);margin-bottom:4px">Mon</div><input type="number" id="ph-1" class="f-input" style="padding:6px 8px;font-size:.8rem" min="0" max="24" step=".5" value="9.5"></div>
          <div><div style="font-size:.64rem;font-weight:700;text-transform:uppercase;color:var(--muted2);margin-bottom:4px">Tue</div><input type="number" id="ph-2" class="f-input" style="padding:6px 8px;font-size:.8rem" min="0" max="24" step=".5" value="9.5"></div>
          <div><div style="font-size:.64rem;font-weight:700;text-transform:uppercase;color:var(--muted2);margin-bottom:4px">Wed</div><input type="number" id="ph-3" class="f-input" style="padding:6px 8px;font-size:.8rem" min="0" max="24" step=".5" value="9.5"></div>
          <div><div style="font-size:.64rem;font-weight:700;text-transform:uppercase;color:var(--muted2);margin-bottom:4px">Thu</div><input type="number" id="ph-4" class="f-input" style="padding:6px 8px;font-size:.8rem" min="0" max="24" step=".5" value="9.5"></div>
          <div><div style="font-size:.64rem;font-weight:700;text-transform:uppercase;color:var(--muted2);margin-bottom:4px">Fri</div><input type="number" id="ph-5" class="f-input" style="padding:6px 8px;font-size:.8rem" min="0" max="24" step=".5" value="8.5"></div>
          <div><div style="font-size:.64rem;font-weight:700;text-transform:uppercase;color:var(--muted2);margin-bottom:4px">Sat</div><input type="number" id="ph-6" class="f-input" style="padding:6px 8px;font-size:.8rem" min="0" max="24" step=".5" value="9.5"></div>
          <div><div style="font-size:.64rem;font-weight:700;text-transform:uppercase;color:var(--muted2);margin-bottom:4px;opacity:.5">Sun</div><input type="number" id="ph-0" class="f-input" style="padding:6px 8px;font-size:.8rem;opacity:.4" value="0" disabled></div>
        </div>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button class="btn-primary" onclick="savePlanHours()" style="font-size:.78rem;padding:8px 16px">Save Hours</button>
          <button class="btn-outline" onclick="togglePlanHoursPanel()" style="font-size:.78rem;padding:8px 16px">Cancel</button>
        </div>
      </div>

      <!-- Legend -->
      <div class="plan-legend plan-print-hide">
        <div class="pl-item"><div class="pl-dot" style="background:#2455CC"></div><span class="pl-txt">ASOS</span></div>
        <div class="pl-item"><div class="pl-dot" style="background:#C4A35A"></div><span class="pl-txt">PLT</span></div>
        <div class="pl-item"><div class="pl-dot" style="background:#196741"></div><span class="pl-txt">River Island</span></div>
        <div class="pl-item"><div class="pl-dot" style="background:#D4626B"></div><span class="pl-txt">Boohoo</span></div>
        <div class="pl-item"><div class="pl-dot" style="background:#7B5EA7"></div><span class="pl-txt">Proto / Sample</span></div>
        <div class="pl-item" style="margin-left:auto">
          <div style="width:12px;height:12px;background:rgba(0,0,0,.04);border:1px solid #E6E2DC;border-radius:2px"></div>
          <span class="pl-txt" style="color:var(--muted)">Sunday OFF</span>
        </div>
        <div class="pl-item">
          <div style="width:12px;height:12px;background:rgba(196,163,90,.12);border:1px solid rgba(196,163,90,.3);border-radius:2px"></div>
          <span class="pl-txt" style="color:var(--gold)">Today</span>
        </div>
      </div>

      <!-- Calendar -->
      <div class="plan-wrap">
        <div id="plan-root"></div>
      </div>
