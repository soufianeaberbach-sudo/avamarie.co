
      <!-- KPI bar -->
      <div class="cs-kpi-bar" id="pack-kpis"></div>

      <div class="cs-layout">

        <!-- Form -->
        <div class="cs-form-card">
          <div class="cs-card-title">Create Carton</div>

          <div class="cs-field">
            <label>PO Number</label>
            <select id="pack-po" onchange="onPackPoChange()">
              <option value="">Select order…</option>
            </select>
          </div>

          <div class="field-row">
            <div class="cs-field">
              <label>Model</label>
              <input type="text" id="pack-model" readonly placeholder="Auto-filled">
            </div>
            <div class="cs-field">
              <label>Carton #</label>
              <input type="text" id="pack-ctn-id" readonly placeholder="Auto-assigned">
            </div>
          </div>

          <div class="cs-field">
            <label>Date</label>
            <input type="date" id="pack-date">
          </div>

          <div class="cs-field">
            <label>Size Breakdown</label>
            <div class="size-inputs" id="pack-sizes">
              <span style="font-size:.78rem;color:var(--muted2)">Select a PO to load sizes.</span>
            </div>
            <div class="ctn-total-row">
              <span>Total</span>
              <span class="ctn-total-num" id="pack-total">0</span>
              <span style="font-size:.72rem;color:var(--muted)">pcs</span>
            </div>
          </div>

          <div class="field-row">
            <div class="cs-field">
              <label>Gross Weight (kg)</label>
              <input type="number" id="pack-gross" min="0" step="0.1" placeholder="0.0">
            </div>
            <div class="cs-field">
              <label>Net Weight (kg)</label>
              <input type="number" id="pack-net" min="0" step="0.1" placeholder="0.0">
            </div>
          </div>

          <button class="btn-primary" style="width:100%;justify-content:center" onclick="saveCarton(1)">
            <i data-lucide="check"></i> Save Carton
          </button>

          <!-- Bulk create -->
          <div class="bulk-row">
            <span class="bulk-label">Bulk create</span>
            <input type="number" id="bulk-n" class="bulk-n" min="2" max="999" value="5" placeholder="N">
            <span class="bulk-label">identical cartons</span>
            <button class="btn-outline" style="margin-left:auto;padding:5px 12px;font-size:.7rem" onclick="bulkCreateCartons()">
              <i data-lucide="layers"></i> Create
            </button>
          </div>
        </div>

        <!-- Carton table -->
        <div class="cs-log-card">
          <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
            <div class="cs-card-title" style="margin:0">Carton List</div>
            <span id="pack-log-count" class="toolbar-count"></span>
          </div>
          <div id="pack-log-table"></div>
        </div>

      </div>
