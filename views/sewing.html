<!-- KPI bar -->
      <div class="cs-kpi-bar" id="sew-kpis"></div>

      <div class="cs-layout">

        <!-- Form -->
        <div class="cs-form-card">
          <div class="cs-card-title">Log Sewing Session</div>

          <div class="cs-field">
            <label>PO Number</label>
            <select id="sew-po">
              <option value="">Select order…</option>
            </select>
          </div>

          <div class="field-row">
            <div class="cs-field">
              <label>Line</label>
              <input type="number" id="sew-line" min="1" max="20" placeholder="1–20">
            </div>
            <div class="cs-field">
              <label>Date</label>
              <input type="date" id="sew-date">
            </div>
          </div>

          <div class="cs-field">
            <label>Period</label>
            <div class="sew-period-row">
              <button class="period-btn active" id="btn-AM" onclick="selectPeriod('AM')">AM</button>
              <button class="period-btn" id="btn-PM" onclick="selectPeriod('PM')">PM</button>
            </div>
          </div>

          <div class="cs-field">
            <label>Pieces Completed</label>
            <input type="number" id="sew-pieces" min="0" placeholder="0">
          </div>

          <div class="cs-field">
            <label>Defects</label>
            <div class="defect-checks" id="defect-checks"></div>
          </div>

          <button class="btn-primary" style="width:100%;justify-content:center;margin-top:4px" onclick="saveSewLog()">
            <i data-lucide="check"></i> Save Entry
          </button>
        </div>

        <!-- Summary table -->
        <div class="cs-log-card">
          <div style="padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
            <div class="cs-card-title" style="margin:0">Daily Output Log</div>
            <span id="sew-log-count" class="toolbar-count"></span>
          </div>
          <div id="sew-log-table"></div>
        </div>

      </div>
