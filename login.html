<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Login — Ava Marie</title>
<link rel="icon" href="AVA%20MARIE/icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gotrue-js@0.9.29/lib/index.umd.min.js"></script>
<style>
:root{
  --dark:#1A1714;--dark2:#252119;--dark3:#312E27;
  --gold:#D4AF37;--gold2:#E0C35C;--gold3:#A88B2A;
  --cream:#F5F1EB;--border:rgba(212,175,55,.2);
  --white:#FFFFFF;--muted:rgba(245,241,235,.4);
  --ease-out:cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
body{
  background:var(--dark);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;position:relative;overflow:hidden;
}

/* Textured background */
body::before{
  content:'';position:absolute;inset:0;
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.015) 0,rgba(255,255,255,.015) 1px,transparent 0,transparent 72px),
    repeating-linear-gradient(180deg,rgba(255,255,255,.015) 0,rgba(255,255,255,.015) 1px,transparent 0,transparent 72px);
  pointer-events:none;z-index:0;
}
body::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 80% at 50% 0%,rgba(212,175,55,.07) 0%,transparent 65%);
  pointer-events:none;z-index:0;
}

/* Gold accent line at top */
.top-bar{position:fixed;top:0;left:0;right:0;height:2px;background:linear-gradient(to right,transparent,var(--gold),transparent);z-index:100}

/* Back link */
.back-link{
  position:fixed;top:2rem;left:2.5rem;z-index:100;
  display:inline-flex;align-items:center;gap:.5rem;
  font-size:.72rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(245,241,235,.3);text-decoration:none;transition:color .25s;
}
.back-link:hover{color:var(--gold)}
.back-link svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Card */
.card{
  position:relative;z-index:1;
  width:100%;max-width:440px;
  background:var(--dark2);
  border:1px solid var(--border);
  padding:3.5rem 3.5rem 3rem;
  animation:cardIn .7s var(--ease-out) both;
}
@keyframes cardIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

/* Logo */
.card-logo{
  font-family:'Bebas Neue',sans-serif;
  font-size:2rem;letter-spacing:.12em;
  color:var(--white);margin-bottom:.25rem;
  cursor:pointer;display:inline-block;
}
.card-logo span{color:var(--gold)}

/* Divider */
.card-rule{
  width:100%;height:1px;
  background:linear-gradient(to right,var(--border),transparent);
  margin:.75rem 0 2rem;
}

/* Eyebrow */
.card-eyebrow{
  font-size:.62rem;font-weight:700;letter-spacing:.3em;text-transform:uppercase;
  color:var(--gold);display:flex;align-items:center;gap:.65rem;margin-bottom:.9rem;
}
.card-eyebrow::before{content:'';width:24px;height:1px;background:var(--gold)}

/* Title */
.card-title{
  font-family:'Bebas Neue',sans-serif;
  font-size:2.6rem;letter-spacing:.04em;line-height:.95;
  color:var(--white);margin-bottom:2rem;
}
.card-title span{color:var(--gold)}

/* Form fields */
.fg{display:flex;flex-direction:column;gap:.45rem;margin-bottom:1.25rem}
.fg label{
  font-size:.68rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(245,241,235,.4);
}
.fg input{
  background:var(--dark3);border:1px solid rgba(255,255,255,.08);
  color:var(--white);font-family:'DM Sans',sans-serif;font-size:.95rem;
  padding:.85rem 1rem;outline:none;transition:border-color .25s,box-shadow .25s;
  -webkit-appearance:none;
}
.fg input:-webkit-autofill{-webkit-box-shadow:0 0 0 40px var(--dark3) inset!important;-webkit-text-fill-color:var(--white)!important}
.fg input:focus{border-color:rgba(212,175,55,.5);box-shadow:0 0 0 3px rgba(212,175,55,.08)}

/* Password wrapper */
.pwd-wrap{position:relative}
.pwd-wrap input{width:100%;padding-right:3rem}
.pwd-toggle{
  position:absolute;right:.9rem;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;padding:.2rem;
  color:rgba(245,241,235,.3);transition:color .2s;line-height:0;
}
.pwd-toggle:hover{color:var(--gold)}
.pwd-toggle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Remember / Forgot row */
.form-footer{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:1.75rem;margin-top:-.25rem;
}
.remember{
  display:flex;align-items:center;gap:.55rem;
  font-size:.82rem;color:rgba(245,241,235,.35);cursor:pointer;user-select:none;
}
.remember input[type="checkbox"]{
  appearance:none;-webkit-appearance:none;
  width:16px;height:16px;border:1px solid rgba(255,255,255,.15);
  background:var(--dark3);cursor:pointer;position:relative;flex-shrink:0;
  transition:border-color .2s,background .2s;
}
.remember input[type="checkbox"]:checked{background:var(--gold);border-color:var(--gold)}
.remember input[type="checkbox"]:checked::after{
  content:'';position:absolute;left:4px;top:1.5px;
  width:5px;height:9px;border:2px solid var(--dark);
  border-top:none;border-left:none;transform:rotate(42deg);
}
.forgot{
  font-size:.8rem;color:rgba(212,175,55,.55);
  text-decoration:none;transition:color .2s;letter-spacing:.03em;
}
.forgot:hover{color:var(--gold)}

/* Error / success message */
.msg{
  font-size:.82rem;line-height:1.5;margin-bottom:1rem;
  min-height:1.2rem;text-align:center;
  transition:opacity .3s;
}
.msg.error{color:#e07070}
.msg.success{color:var(--gold2)}

/* Submit button */
.btn-login{
  width:100%;padding:1.1rem;
  background:var(--gold);color:var(--dark);
  font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:.12em;
  border:none;cursor:pointer;transition:background .25s,color .25s,opacity .25s;
  position:relative;overflow:hidden;
}
.btn-login::before{
  content:'';position:absolute;inset:0;
  background:rgba(255,255,255,.18);
  transform:translateX(-101%);transition:transform .4s var(--ease-out);
}
.btn-login:hover::before{transform:translateX(0)}
.btn-login:disabled{opacity:.55;cursor:not-allowed}
.btn-login:disabled::before{display:none}

/* Bottom note */
.card-note{
  margin-top:1.5rem;text-align:center;
  font-size:.72rem;color:rgba(245,241,235,.18);letter-spacing:.06em;
  line-height:1.6;
}
.card-note a{color:rgba(212,175,55,.4);text-decoration:none;transition:color .2s}
.card-note a:hover{color:var(--gold)}

/* Security badge */
.security-badge{
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  margin-top:1.25rem;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(245,241,235,.15);
}
.security-badge svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.6}
</style>
</head>
<body>

<div class="top-bar"></div>

<a class="back-link" href="index.html">
  <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  Back to Site
</a>

<div class="card">

  <div class="card-logo" onclick="window.location.href='index.html'">AVA <span>MARIE</span></div>
  <div class="card-rule"></div>

  <div class="card-eyebrow">Secure Access</div>
  <h1 class="card-title">ERP<br><span>SYSTEM</span></h1>

  <form id="loginForm" onsubmit="handleLogin(event)" novalidate>

    <div class="fg">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="your@email.com" autocomplete="email" required>
    </div>

    <div class="fg">
      <label for="pwd">Password</label>
      <div class="pwd-wrap">
        <input type="password" id="pwd" name="password" placeholder="••••••••••••" autocomplete="current-password" required>
        <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="Show/hide password" onclick="togglePwd()">
          <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <div class="form-footer">
      <label class="remember">
        <input type="checkbox" id="remember">
        Remember me
      </label>
      <a class="forgot" href="#" onclick="handleForgot(event)">Forgot Password?</a>
    </div>

    <div class="msg" id="msg" role="alert"></div>

    <button class="btn-login" type="submit" id="loginBtn">LOGIN</button>

  </form>

  <p class="card-note">
    Authorized personnel only.<br>
    Need access? <a href="mailto:anwar@figaltd.co.uk">Contact your administrator</a>
  </p>

  <div class="security-badge">
    <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    Secured by Netlify Identity
  </div>

</div>

<script>
// Initialise GoTrue with the current site's Netlify Identity endpoint
var auth = new GoTrue.default({
  APIUrl: window.location.origin + '/.netlify/identity',
  audience: '',
  setCookie: true,
});

// Redirect if already authenticated
(function() {
  try {
    var u = auth.currentUser();
    if (u && u.token) {
      window.location.replace('/admin/');
    }
  } catch (e) {}
})();

function showMsg(text, type) {
  var el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + (type || '');
}

function handleLogin(e) {
  e.preventDefault();
  var email    = document.getElementById('email').value.trim();
  var password = document.getElementById('pwd').value;
  var remember = document.getElementById('remember').checked;
  var btn      = document.getElementById('loginBtn');

  if (!email || !password) {
    showMsg('Please enter your email and password.', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'AUTHENTICATING…';
  showMsg('');

  auth.login(email, password, remember)
    .then(function(user) {
      btn.textContent = 'ACCESS GRANTED ✓';
      showMsg('Welcome back. Redirecting…', 'success');
      setTimeout(function() { window.location.replace('/admin/'); }, 900);
    })
    .catch(function(err) {
      var msg = (err && err.json && err.json.error_description)
        ? err.json.error_description
        : 'Invalid email or password. Please try again.';
      showMsg(msg, 'error');
      btn.disabled = false;
      btn.textContent = 'LOGIN';
    });
}

function handleForgot(e) {
  e.preventDefault();
  var email = document.getElementById('email').value.trim();
  if (!email) {
    showMsg('Enter your email address above, then click Forgot Password.', 'error');
    document.getElementById('email').focus();
    return;
  }
  auth.requestPasswordRecovery(email)
    .then(function() {
      showMsg('Recovery email sent — check your inbox.', 'success');
    })
    .catch(function() {
      showMsg('Could not send recovery email. Please contact your administrator.', 'error');
    });
}

function togglePwd() {
  var input = document.getElementById('pwd');
  var icon  = document.getElementById('eyeIcon');
  if (input.type === 'password') {
    input.type = 'text';
    icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    input.type = 'password';
    icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}
</script>
</body>
</html>
