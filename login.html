<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERP Login — Ava Marie</title>
<link rel="icon" href="AVA%20MARIE/icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#C4A35A;--dark:#1A1A1A;--cream:#F5F1EB;--cream2:#EDE8DF;
  --border:#E0DAD2;--text:#1A1A1A;--muted:#7A756A;--white:#fff;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;-webkit-font-smoothing:antialiased}
body{font-family:'DM Sans',sans-serif;background:var(--cream);display:flex;flex-direction:column;min-height:100vh}

.top-stripe{height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.back-link{
  position:fixed;top:1.5rem;left:2rem;z-index:10;
  display:inline-flex;align-items:center;gap:.4rem;
  font-size:.68rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:var(--muted);text-decoration:none;transition:color .2s
}
.back-link:hover{color:var(--dark)}
.back-link svg{width:13px;height:13px}

.main{flex:1;display:flex;align-items:center;justify-content:center;padding:4rem 1.5rem}

.card{
  width:100%;max-width:420px;
  background:var(--white);
  border:1px solid var(--border);
  padding:0;
  box-shadow:0 4px 60px rgba(0,0,0,.06)
}

.card-header{
  padding:2.5rem 2.5rem 0;
  text-align:center;
  border-bottom:1px solid var(--cream2);
  padding-bottom:2rem;
  margin-bottom:0
}
.logo-wrap{display:inline-flex;flex-direction:column;align-items:center;gap:.3rem}
.logo-eyebrow{
  font-size:.6rem;font-weight:600;letter-spacing:.35em;text-transform:uppercase;
  color:var(--muted)
}
.logo-text{
  font-family:'Bebas Neue',sans-serif;font-size:2.8rem;letter-spacing:.18em;
  color:var(--dark);line-height:1
}
.logo-text span{color:var(--gold)}
.logo-divider{width:28px;height:1px;background:var(--gold);margin:.6rem auto}
.logo-tagline{
  font-family:'Playfair Display',serif;font-style:italic;
  font-size:.88rem;color:var(--muted);line-height:1.65
}

.card-body{padding:2rem 2.5rem 2.5rem}

.form-group{margin-bottom:1.1rem}
.form-label{
  display:block;margin-bottom:.45rem;
  font-size:.66rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)
}
.form-input{
  width:100%;height:46px;padding:0 1rem;
  background:#FAFAF8;border:1.5px solid var(--border);
  font-family:'DM Sans',sans-serif;font-size:.92rem;color:var(--text);
  outline:none;transition:border-color .2s,box-shadow .2s
}
.form-input:focus{
  border-color:var(--gold);background:#fff;
  box-shadow:0 0 0 3px rgba(196,163,90,.1)
}
.form-input::placeholder{color:#C0BAB0}

.password-wrap{position:relative}
.password-toggle{
  position:absolute;right:.75rem;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:var(--muted);
  padding:4px;display:flex;align-items:center;transition:color .2s
}
.password-toggle:hover{color:var(--dark)}
.password-toggle svg{width:16px;height:16px}

.error-msg{
  display:none;
  background:rgba(192,57,43,.06);border:1px solid rgba(192,57,43,.2);
  color:#C0392B;font-size:.8rem;padding:.6rem .85rem;margin-bottom:1rem;
  border-left:3px solid #C0392B
}

.btn-login{
  width:100%;height:50px;
  background:var(--gold);color:#fff;
  font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;
  border:none;cursor:pointer;transition:background .2s;
  margin-bottom:1.25rem
}
.btn-login:hover{background:#A88430}
.btn-login:active{transform:scale(.995)}

.demo-hint{
  text-align:center;font-size:.72rem;color:var(--muted);
  background:rgba(196,163,90,.07);border:1px dashed rgba(196,163,90,.3);
  padding:.55rem .75rem;border-radius:2px
}
.demo-hint strong{color:var(--gold);font-weight:700}

footer.foot{
  text-align:center;padding:1.25rem;
  font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(122,117,106,.4)
}
</style>
</head>
<body>
<div class="top-stripe"></div>

<a href="index.html" class="back-link">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  Back to site
</a>

<main class="main">
  <div class="card">
    <div class="card-header">
      <div class="logo-wrap">
        <span class="logo-eyebrow">Internal ERP System</span>
        <div class="logo-text">AVA <span>MARIE</span></div>
        <div class="logo-divider"></div>
        <p class="logo-tagline">Precision at every step,<br>from pattern to dispatch.</p>
      </div>
    </div>

    <div class="card-body">
      <div id="errorMsg" class="error-msg"></div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input class="form-input" type="email" id="email" placeholder="you@avamarie.ma" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <div class="password-wrap">
          <input class="form-input" type="password" id="password" placeholder="••••••••••" autocomplete="current-password" style="padding-right:2.75rem">
          <button class="password-toggle" type="button" onclick="togglePw(this)" aria-label="Show password">
            <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn-login" onclick="doLogin()">Sign In to ERP</button>

      <p class="demo-hint">Demo password: <strong>avamarie2026</strong></p>
    </div>
  </div>
</main>

<footer class="foot">© 2026 Ava Marie · Tanger, Maroc · Système confidentiel</footer>

<script>
// Redirect if already authenticated
if (sessionStorage.getItem('erp_auth') === '1') {
  window.location.replace('erp.html');
}

function togglePw(btn) {
  var inp = document.getElementById('password');
  var eye = document.getElementById('eyeIcon');
  if (inp.type === 'password') {
    inp.type = 'text';
    eye.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    inp.type = 'password';
    eye.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
  }
}

function doLogin() {
  var email = document.getElementById('email').value.trim();
  var pass  = document.getElementById('password').value;
  var err   = document.getElementById('errorMsg');
  err.style.display = 'none';

  if (!email) {
    err.textContent = 'Please enter your email address.';
    err.style.display = 'block';
    return;
  }
  if (pass === 'avamarie2026') {
    sessionStorage.setItem('erp_auth', '1');
    sessionStorage.setItem('erp_user', email.split('@')[0]);
    window.location.href = 'erp.html';
  } else {
    err.textContent = 'Incorrect password. Please try again.';
    err.style.display = 'block';
    document.getElementById('password').focus();
    document.getElementById('password').select();
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
