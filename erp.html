<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ava Marie — ERP</title>
<link rel="icon" href="AVA%20MARIE/icon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/erp-style.css">
</head>
<body>

<!-- ═══════════════════════════ SIDEBAR ══════════════════════════ -->
<nav id="sidebar">

  <div class="sb-logo">
    <div class="sb-logo-text">AVA <span>MARIE</span></div>
    <div class="sb-logo-sub">ERP System</div>
  </div>

  <div class="sb-nav">

    <button class="nav-item active" data-sec="dashboard" onclick="nav(this)">
      <i data-lucide="layout-dashboard"></i><span>Dashboard</span>
    </button>
    <button class="nav-item" data-sec="models" onclick="nav(this)">
      <i data-lucide="shirt"></i><span>Models</span>
    </button>
    <button class="nav-item" data-sec="orders" onclick="nav(this)">
      <i data-lucide="clipboard-list"></i><span>Orders</span>
    </button>
    <button class="nav-item" data-sec="planning" onclick="nav(this)">
      <i data-lucide="calendar-range"></i><span>Planning</span>
    </button>

    <div class="nav-sep"></div>

    <button class="nav-item" data-sec="cutting" onclick="nav(this)">
      <i data-lucide="scissors"></i><span>Cutting</span>
    </button>
    <button class="nav-item" data-sec="sewing" onclick="nav(this)">
      <i data-lucide="spool"></i><span>Sewing</span>
    </button>
    <button class="nav-item" data-sec="finishing" onclick="nav(this)">
      <i data-lucide="sparkles"></i><span>Finishing</span>
    </button>
    <button class="nav-item" data-sec="packing" onclick="nav(this)">
      <i data-lucide="box"></i><span>Packing</span>
    </button>

    <div class="nav-sep"></div>

    <button class="nav-item" data-sec="materials" onclick="nav(this)">
      <i data-lucide="warehouse"></i><span>Materials</span>
    </button>
    <button class="nav-item" data-sec="settings" onclick="nav(this)">
      <i data-lucide="settings"></i><span>Settings</span>
    </button>

    <div class="nav-sep"></div>

    <button class="nav-item" onclick="logout()">
      <i data-lucide="log-out"></i><span>Logout</span>
    </button>

  </div>

  <div class="sb-user">
    <div class="sb-avatar">S</div>
    <div>
      <div class="sb-uname">Soufiane</div>
      <div class="sb-urole">Admin</div>
    </div>
  </div>

</nav>

<!-- ═══════════════════════════ OVERLAY ══════════════════════════ -->
<div id="sb-overlay" onclick="closeSidebar()"></div>

<!-- ═══════════════════════════ MAIN ═════════════════════════════ -->
<div id="main">

  <!-- TOP BAR -->
  <header id="topbar">
    <div class="tb-left">
      <button class="tb-btn tb-ham" onclick="openSidebar()" aria-label="Menu">
        <i data-lucide="menu"></i>
      </button>
      <div class="tb-icon" id="tb-icon"><i data-lucide="layout-dashboard"></i></div>
      <span id="tb-title">Dashboard</span>
    </div>
    <div class="tb-right">
      <span id="tb-date"></span>
      <div class="tb-bell-wrap">
        <button class="tb-btn" aria-label="Notifications">
          <i data-lucide="bell"></i>
        </button>
        <span class="bell-dot"></span>
      </div>
    </div>
  </header>

  <!-- CONTENT -->
  <main id="content">

    <div id="sec-dashboard" class="sec active"></div>

    <div id="sec-models" class="sec"></div>

    <div id="sec-orders" class="sec"></div>

    <div id="sec-order-detail" class="sec"></div>

    <div id="sec-planning" class="sec"></div>

    <div id="sec-cutting" class="sec"></div>

    <div id="sec-sewing" class="sec"></div>

    <div id="sec-finishing" class="sec"></div>

    <div id="sec-packing" class="sec"></div>

    <div id="sec-materials" class="sec"></div>

    <div id="sec-settings" class="sec"></div>

    <div id="sec-model-detail" class="sec"></div>


  </main>
</div>

<!-- PLAN VIEW POPUP -->
<div id="plan-view-popup" onclick="closePlanView()">
  <div id="plan-view-card" onclick="event.stopPropagation()">
    <div id="plan-view-body"></div>
  </div>
</div>

<!-- PLAN ADD POPUP -->
<div id="plan-add-popup" onclick="closePlanAdd()">
  <div id="plan-add-card" onclick="event.stopPropagation()">
    <button class="popup-close" onclick="closePlanAdd()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="popup-model-id" style="margin-bottom:4px">NEW BLOCK</div>
    <div class="popup-op-lbl" id="plan-add-title" style="margin-bottom:18px">Add Production Block</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="cs-field" style="grid-column:1/-1">
        <label class="cs-lbl">Line</label>
        <select id="pa-line" class="cs-select"><option value="">Select line…</option></select>
      </div>
      <div class="cs-field" style="grid-column:1/-1">
        <label class="cs-lbl">Model / Style</label>
        <select id="pa-model" class="cs-select" onchange="onAddBModelChange()"><option value="">Select model…</option></select>
      </div>
      <div class="cs-field" style="grid-column:1/-1">
        <label class="cs-lbl">PO / Job Ref</label>
        <select id="pa-po" class="cs-select" onchange="onAddBPoChange()"><option value="">Select PO…</option></select>
      </div>
      <div class="cs-field">
        <label class="cs-lbl">Colour</label>
        <input type="text" id="pa-colour" class="cs-input" placeholder="e.g. Ivory">
      </div>
      <div class="cs-field">
        <label class="cs-lbl">Qty (pcs)</label>
        <input type="number" id="pa-qty" class="cs-input" min="1" placeholder="e.g. 500" oninput="calcAddBEnd()">
      </div>
      <div class="cs-field">
        <label class="cs-lbl">PPH (pcs/hour)</label>
        <input type="number" id="pa-pph" class="cs-input" min="1" placeholder="e.g. 25" oninput="calcAddBEnd()">
      </div>
      <div class="cs-field">
        <label class="cs-lbl">Start Date</label>
        <input type="date" id="pa-start" class="cs-input" onchange="calcAddBEnd()">
      </div>
      <div class="cs-field">
        <label class="cs-lbl">Est. End Date</label>
        <input type="text" id="pa-end" class="cs-input" placeholder="Auto-calculated" readonly style="background:#FAFAF8;color:var(--muted)">
      </div>
    </div>
    <div style="margin-top:18px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn-outline" onclick="closePlanAdd()">Cancel</button>
      <button class="btn-primary" onclick="saveNewBlock()">Add Block</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"><div id="toast-inner" class="toast-inner"></div></div>

<!-- ═══════════════════════════ SCRIPTS ══════════════════════════ -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="js/erp-script.js"></script>
</body>
</html>
